name: Daily Telegram News

on:
  workflow_dispatch:

  schedule:
    - cron: "30 8 * * *"
      timezone: "Asia/Baku"

jobs:
  send-news:
    runs-on: ubuntu-latest

    steps:
      - name: Kodları yüklə
        uses: actions/checkout@v4

      - name: Python quraşdır
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lazımi proqramları quraşdır
        run: pip install -r requirements.txt

      - name: Xəbərləri Telegram-a göndər
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python news_bot.py
